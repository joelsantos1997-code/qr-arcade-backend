name: Verify PaySync foundation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - name: Reject tracked secrets and dependencies
        run: |
          if git ls-files | grep -E '(^|/)(node_modules/|\.env$|\.env\.(local|production|development)$)'; then
            exit 1
          fi
